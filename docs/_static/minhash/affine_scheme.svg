<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- input value -->
  <rect x="16" y="58" width="100" height="64" rx="8" fill="#f5f7fa" stroke="#4b5563"/>
  <text x="66" y="86" text-anchor="middle" font-size="14" fill="#111827">input value</text>
  <text x="66" y="104" text-anchor="middle" font-size="11" fill="#6b7280">bytes</text>

  <line x1="116" y1="90" x2="144" y2="90" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- hash function -->
  <rect x="148" y="58" width="126" height="64" rx="8" fill="#f5f7fa" stroke="#4b5563"/>
  <text x="211" y="86" text-anchor="middle" font-size="14" fill="#111827">hash function</text>
  <text x="211" y="104" text-anchor="middle" font-size="11" fill="#6b7280">SHA1, mmh3, &#8230;</text>

  <line x1="274" y1="90" x2="308" y2="90" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="291" y="78" text-anchor="middle" font-size="12" fill="#111827" font-style="italic">h</text>
  <text x="291" y="110" text-anchor="middle" font-size="10" fill="#6b7280">w-bit</text>

  <!-- fmix -->
  <rect x="312" y="58" width="134" height="64" rx="8" fill="#eaf2fb" stroke="#1f77b4"/>
  <text x="379" y="80" text-anchor="middle" font-size="14" fill="#111827">fmix</text>
  <text x="379" y="98" text-anchor="middle" font-size="11" fill="#6b7280">MurmurHash3 finalizer</text>
  <text x="379" y="112" text-anchor="middle" font-size="11" fill="#6b7280">(fixed bijection)</text>

  <line x1="446" y1="90" x2="480" y2="90" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="463" y="78" text-anchor="middle" font-size="12" fill="#111827" font-style="italic">h&#8242;</text>

  <!-- permutation bank -->
  <rect x="492" y="66" width="176" height="64" rx="8" fill="#f3f7fd" stroke="#9ec3e8"/>
  <rect x="488" y="62" width="176" height="64" rx="8" fill="#f3f7fd" stroke="#9ec3e8"/>
  <rect x="484" y="58" width="176" height="64" rx="8" fill="#eaf2fb" stroke="#1f77b4"/>
  <text x="572" y="84" text-anchor="middle" font-size="14" fill="#111827" font-style="italic">a<tspan dy="3" font-size="10">k</tspan><tspan dy="-3"> &#183; h&#8242; + b</tspan><tspan dy="3" font-size="10">k</tspan><tspan dy="-3" font-style="normal"> mod 2</tspan><tspan dy="-6" font-size="10" font-style="normal">w</tspan></text>
  <text x="572" y="103" text-anchor="middle" font-size="11" fill="#6b7280">k = 1 &#8230; num_perm</text>
  <text x="572" y="116" text-anchor="middle" font-size="11" fill="#6b7280">a<tspan dy="2" font-size="9">k</tspan><tspan dy="-2"> odd, so a bijection</tspan></text>

  <line x1="668" y1="90" x2="704" y2="90" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- running minimum -->
  <rect x="708" y="58" width="200" height="64" rx="8" fill="#f5f7fa" stroke="#4b5563"/>
  <text x="808" y="86" text-anchor="middle" font-size="14" fill="#111827">running minimum</text>
  <text x="808" y="104" text-anchor="middle" font-size="11" fill="#6b7280">one slot per permutation</text>

  <line x1="816" y1="122" x2="816" y2="168" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- signature -->
  <text x="664" y="186" text-anchor="end" font-size="12" fill="#111827">MinHash signature</text>
  <text x="664" y="201" text-anchor="end" font-size="10" fill="#6b7280">uint32 (affine32) / uint64 (affine64)</text>
  <g stroke="#4b5563" fill="#ffffff">
    <rect x="672" y="172" width="32" height="28"/>
    <rect x="704" y="172" width="32" height="28"/>
    <rect x="736" y="172" width="32" height="28"/>
    <rect x="768" y="172" width="32" height="28"/>
    <rect x="800" y="172" width="32" height="28" fill="#eaf2fb" stroke="#1f77b4"/>
    <rect x="832" y="172" width="32" height="28"/>
    <rect x="864" y="172" width="32" height="28"/>
    <rect x="896" y="172" width="32" height="28"/>
  </g>
  <text x="816" y="216" text-anchor="middle" font-size="10" fill="#1f77b4">slot k</text>

  <!-- footnote -->
  <text x="16" y="256" font-size="11" fill="#6b7280">w = 32 for the affine32 scheme and 64 for affine64. The modulo costs no instruction: it is the natural</text>
  <text x="16" y="271" font-size="11" fill="#6b7280">wraparound of w-bit unsigned arithmetic.</text>
</svg>
